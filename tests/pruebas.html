<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruebas del motor</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/estilos.css">
  <script>
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem("tema"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      d.dataset.theme = t;
    })();
  </script>
  <style>
    /* estilos propios de esta pagina; los colores vienen de css/estilos.css */
    .tests{ max-width: 920px; margin: 0 auto; padding: 48px 22px 80px; }
    .tests h1{ font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
    .tests .lead{ color: var(--fg-muted); font-size: 18px; margin: 12px 0 28px; max-width: 640px; }
    .top{ display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 28px; }
    .summary{
      border-radius: var(--radius); padding: 28px; margin-bottom: 24px; text-align: center;
      background: var(--surface); border: 1px solid var(--border);
    }
    .summary b{ display: block; font-size: clamp(40px, 7vw, 64px); letter-spacing: -.03em; line-height: 1.05; font-family: var(--font-display); }
    .summary.ok b{ color: var(--good); } .summary.bad b{ color: var(--bad); }
    .summary span{ color: var(--fg-2); }
    .group{ background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 20px 22px; margin-bottom: 14px; }
    .group h2{ font-size: 19px; font-weight: 700; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; }
    .group h2 .n{ margin-left: auto; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 980px; }
    .group.ok h2 .n{ background: var(--good-soft); color: var(--good); }
    .group.bad h2 .n{ background: var(--bad-soft); color: var(--bad); }
    .group .req{ color: var(--fg-muted); font-size: 14px; margin: 4px 0 12px; }
    .case{ display: grid; grid-template-columns: 22px 1fr; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 15px; }
    .case i{ font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; margin-top: 2px; }
    .case.ok i{ background: var(--good-soft); color: var(--good); }
    .case.bad i{ background: var(--bad-soft); color: var(--bad); }
    .case .d{ grid-column: 2; color: var(--fg-muted); font-size: 13px; font-family: var(--font-formula); white-space: pre-wrap; word-break: break-word; }
    .case.bad .d{ color: var(--bad); }
    .group.skip h2 .n{ background: var(--tint-2); color: var(--fg-muted); }
    .case.skip i{ background: var(--tint-2); color: var(--fg-muted); }
    iframe.ui{ position: absolute; width: 1100px; height: 900px; left: -99999px; top: 0; border: 0; }
  </style>
</head>
<body>
  <main class="tests">
    <p class="eyebrow">Motor de inferencia · Verificación</p>
    <h1>Pruebas del motor.</h1>
    <p class="lead">Cada grupo corresponde a un punto de la rúbrica de la misión. Las pruebas usan el mismo <code>motor.js</code> que la página y, al final, revisan la página real con el caso del video.</p>
    <div class="top">
      <a class="btn btn-ghost" href="../index.html">← Volver al motor</a>
      <button class="btn btn-primary" id="btnCorrer" type="button">Volver a correr</button>
    </div>
    <div class="summary" id="resumen"><b>…</b><span>Corriendo pruebas</span></div>
    <div id="grupos"></div>
  </main>

  <script src="../js/motor.js"></script>
  <script src="../js/vista.js"></script>
  <script src="pruebas.js"></script>
</body>
</html>
